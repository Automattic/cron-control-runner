name: Run tests
on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
      - run: go version
      - run: go build
      - run: go test ./...
